<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Mock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #212121; color: #ececec; font-family: sans-serif; }

    nav {
      width: 260px;
      background: #171717;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }

    nav a {
      display: block;
      padding: 8px 12px;
      border-radius: 6px;
      color: #ececec;
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    nav a:hover { background: #2a2a2a; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 18px;
    }

    textarea {
      position: fixed;
      bottom: 20px;
      left: 300px;
      right: 20px;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #ececec;
      font-size: 14px;
      resize: none;
    }
  </style>
</head>
<body>
  <!-- Mirrors real ChatGPT DOM: nav[aria-label="Chat history"] > a[data-sidebar-item][href*="/c/"][aria-label] -->
  <nav aria-label="Chat history">
    <a href="https://chatgpt.com/c/aaa-1111-1111" data-sidebar-item="true" aria-label="Как работает async/await"></a>
    <a href="https://chatgpt.com/c/bbb-2222-2222" data-sidebar-item="true" aria-label="React hooks — объясни useEffect"></a>
    <a href="https://chatgpt.com/c/ccc-3333-3333" data-sidebar-item="true" aria-label="Напиши тесты для функции"></a>
    <a href="https://chatgpt.com/c/ddd-4444-4444" data-sidebar-item="true" aria-label="Разница между TCP и UDP"></a>
    <a href="https://chatgpt.com/c/eee-5555-5555" data-sidebar-item="true" aria-label="SQL оптимизация запросов"></a>
    <a href="https://chatgpt.com/c/fff-6666-6666" data-sidebar-item="true" aria-label="Docker compose пример"></a>
    <a href="https://chatgpt.com/c/ggg-7777-7777" data-sidebar-item="true" aria-label="Python list comprehension"></a>
    <a href="https://chatgpt.com/c/hhh-8888-8888" data-sidebar-item="true" aria-label="Как настроить CI/CD"></a>
    <a href="https://chatgpt.com/c/iii-9999-9999" data-sidebar-item="true" aria-label="TypeScript generics пример"></a>
    <a href="https://chatgpt.com/c/jjj-0000-0000" data-sidebar-item="true" aria-label="Git rebase vs merge"></a>
  </nav>
  <main>Select chats with Cmd+Shift+X</main>
  <textarea placeholder="Message ChatGPT (for testing Esc from input)"></textarea>
</body>
</html>
